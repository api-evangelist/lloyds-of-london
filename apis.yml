aid: lloyds-of-london
url: https://raw.githubusercontent.com/api-evangelist/lloyds-of-london/refs/heads/main/apis.yml
name: Lloyd's of London
kind: company
description: >-
  Lloyd's of London is the world's specialist insurance and reinsurance market, operating as a
  regulated marketplace rather than as a carrier: the Corporation of Lloyd's oversees syndicates,
  managing agents, brokers and coverholders who underwrite property, casualty, marine, aviation,
  energy, cyber, political risk and reinsurance business on a subscription basis from its home
  market in the United Kingdom. Its API posture reflects that role. Lloyd's is a standards and
  market-infrastructure publisher first — the Core Data Record (CDR), the Market Reform Contract
  (MRC), coverholder and delegated claims reporting standards, and Blueprint Two digital
  processing requirements — and its technical surface is aimed at brokers, syndicates and market
  vendors, not at outside developers. Lloyd's ran a public API Development Portal at
  developer.lloyds.com (the "API Factory", BETA from June 2020) that published a Base API
  Standard and a catalogue of three market APIs: Placing — Submission and Quote, Placing — Firm
  Order, and RPAC for delegated authority risk, premium and claims. That portal now redirects to
  www.lloyds.com and no replacement self-serve developer portal is published. Production access
  to the underlying London Market API gateway
  (https://api.londonmarketgroup.co.uk) has always been partner-gated: an organisation must be
  onboarded to LIMOSS Common Services, registered in the Common Services Azure Active Directory
  tenant, and register an X.509 certificate before it can call anything. There is no public,
  self-serve Lloyd's API, no public sandbox and no public downloadable specification reachable
  today — the honest record for this market body is documentation-and-standards-first. What
  Lloyd's does still operate, verified by live probe, is a genuine gated API estate: three
  isolated gateway environments (Sandbox, PreProd, Production), an OpenID Connect discovery
  document and JWKS published on each, and a routed Catastrophe Codes v1 endpoint whose
  unauthenticated /health meta resource answers 200 while its data resources return
  401 "Client certificate is missing". Its most reusable public artifact is the Lloyd's Base API
  Standard — a normative RFC 2119 document fixing the resource model, query grammar, collection
  and error envelopes, versioning compatibility rules and the dual mutual-TLS + JWT security model
  for every API published to the market.
