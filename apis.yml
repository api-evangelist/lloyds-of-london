apis:
- aid: lloyds-of-london:lloyds-placing-api-submission-and-quote
  name: Lloyd's Placing API - Submission and Quote v1
  description: >-
    Market API for electronic placement in the London subscription market — create submissions and
    submission versions, upload Market Reform Contract and quote documents, add carriers and
    underwriters to a submission, send requests for quote, and receive underwriter responses
    (reject, express interest, request for information, or quote). Published by Lloyd's under the
    API Factory programme with a Swagger/OpenAPI 3.0 document
    (Swagger_PlacingSubmissionAndQuote_v1.10.202004160916.json) offered for download from the
    developer portal. Access is partner-gated to onboarded London Market organisations via LIMOSS
    Common Services, Azure AD tokens and a registered X.509 certificate; the developer portal that
    hosted the reference and the specification now redirects to www.lloyds.com, so the spec could
    not be harvested. Covers the QUOTE verb of the insurance lifecycle, broker-to-carrier only.
  humanURL: https://developer.lloyds.com/placingsubmissionandquote-v1/Developer-Overview
  baseURL: https://api.londonmarketgroup.co.uk/PPL/Lloyds/Placing/V1
  tags:
  - Placement
  - Submission
  - Quote
  - London Market
  properties:
  - type: Documentation
    url: https://web.archive.org/web/20210128061829/https://developer.lloyds.com/placingsubmissionandquote-v1/Key-Details-On-API
  - type: APIReference
    url: https://web.archive.org/web/20210128055606/https://developer.lloyds.com/placingsubmissionandquote-v1/Technical-Model
  - type: Documentation
    url: https://web.archive.org/web/20200930095802/https://developer.lloyds.com/Get-Started/Base-API-Standard
  - type: Authentication
    url: https://web.archive.org/web/20200930085423/https://developer.lloyds.com/Get-Started/Authentication-Information
- aid: lloyds-of-london:lloyds-placing-api-firm-order
  name: Lloyd's Placing API - Firm Order
  description: >-
    Second Placing API listed in the Lloyd's API catalogue, described by Lloyd's as "Finalise
    Placings, Bind Risks, Sign Transactions" — the BIND verb of the insurance lifecycle for the
    London subscription market. Only a catalogue-level description was ever published publicly; no
    reference documentation, base URL or downloadable specification is reachable, and the
    developer portal that carried the catalogue now redirects to www.lloyds.com. Partner-gated to
    onboarded market participants.
  humanURL: https://web.archive.org/web/20200610082013/https://developer.lloyds.com/Explore-Innovate
  tags:
  - Placement
  - Firm Order
  - Bind
  - London Market
  properties:
  - type: Documentation
    url: https://web.archive.org/web/20200610082013/https://developer.lloyds.com/Explore-Innovate
- aid: lloyds-of-london:lloyds-rpac-api
  name: Lloyd's RPAC API (Risk, Premium and Claims)
  description: >-
    Third API listed in the Lloyd's API catalogue, described by Lloyd's as "Submit Risk, Premium
    and Claims details for Delegated Authority Placements" — the delegated authority reporting
    path that carries risk, premium and claims (FNOL-adjacent) data from coverholders and
    delegated claims administrators into the market, aligned to Lloyd's Coverholder Reporting
    Standards and ACORD technical standards. Only a catalogue-level description was ever published
    publicly; no reference documentation, base URL or downloadable specification is reachable.
    Partner-gated to onboarded market participants.
  humanURL: https://web.archive.org/web/20200610082013/https://developer.lloyds.com/Explore-Innovate
  tags:
  - Delegated Authority
  - Risk
  - Premium
  - Claims
  properties:
  - type: Documentation
    url: https://web.archive.org/web/20200610082013/https://developer.lloyds.com/Explore-Innovate
  - type: Documentation
    url: https://www.lloyds.com/market-resources/delegated-authorities/market-knowledge/reporting-standards
- aid: lloyds-of-london:lloyds-catastrophe-codes-api
  name: Lloyd's Catastrophe Codes API v1
  description: >-
    Lloyd's catastrophe event reference data served from the London Market API Gateway — the
    market's canonical codes for aggregating losses to a named catastrophe (e.g. 17E "Typhoon
    Hato, 20 August 2017 and ongoing, affecting Hong Kong, Macau and South China"), each carrying
    Code, Definition, EventStartDate, EventEndDate and EventYear. This API was never listed in the
    Lloyd's API catalogue; it surfaced because the Lloyd's Base API Standard uses it for every
    worked example of the identity pseudo-field and the collection wrapper document. It is the
    only Lloyd's API surface still routed on the gateway: probed on 2026-07-25 the unauthenticated
    /health meta resource mandated by section 5.11 of the Base API Standard returns 200 on both
    Production and Sandbox, while /CatastropheCodes and /version return
    401 {"Code":401,"Message":"Client certificate is missing."} — the mutual-TLS gate is live and
    enforcing. Access requires LIMOSS Common Services onboarding, an Azure AD on-behalf-of token
    with scp=user_impersonation, and a registered X.509 certificate per environment. No
    specification is published.
  humanURL: https://web.archive.org/web/20200930095802/https://developer.lloyds.com/Get-Started/Base-API-Standard
  baseURL: https://api.londonmarketgroup.co.uk/Lloyds/CatastropheCodes/v1
  tags:
  - Catastrophe
  - Reference Data
  - London Market
  - Reinsurance
  properties:
  - type: Documentation
    url: https://web.archive.org/web/20200930095802/https://developer.lloyds.com/Get-Started/Base-API-Standard
    name: Lloyd's Base API Standard
    description: The normative standard this endpoint implements, and the source of its published
      payload examples.
  - type: Examples
    url: examples/_index.yml
  - type: Sandbox
    url: sandbox/lloyds-of-london-sandbox.yml
    name: Sandbox environment
    description: https://sand-api.londonmarketgroup.co.uk/Lloyds/CatastropheCodes/v1 — live, /health
      returns 200; access is partner-gated via LIMOSS.
  - type: Authentication
    url: authentication/lloyds-of-london-authentication.yml
  - type: WellKnown
    url: https://api.londonmarketgroup.co.uk/discovery/.well-known/openid-configuration
    name: OpenID Connect discovery
    description: Live OIDC discovery document mandated by section 5.12.2 of the Lloyd's Base API
      Standard; references the gateway JWKS at /discovery/keys.
