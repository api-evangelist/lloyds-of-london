description: Request and response examples published verbatim by Lloyd's on the Placing API Technical
  Model page and in the appendices of the Lloyd's Base API Standard, harvested from Internet Archive captures
  before the developer portal was retired. These are the only machine-readable payload artifacts Lloyd's
  ever published for its market APIs - the referenced Swagger/OpenAPI 3.0 file was never archived and
  its host no longer resolves - so they carry the concrete shape of the collection envelope, the identity
  pseudo-field, the error document, and every Placing resource.
