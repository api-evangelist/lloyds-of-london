format: proprietary
rfc9457: false
description: >-
  Lloyd's does not use RFC 9457 problem+json. The Base API Standard defines a single common
  error document returned from any GET, PUT or POST that results in a 4XX or 5XX, and the
  Placing API published a named error-code registry on top of it. This is the non-payments
  equivalent of a decline-code reference: 107 named, human-readable validation and
  business-rule codes covering field validation, referential integrity, submission-version
  consistency, document handling and delegated authorisation. Captured verbatim from the
  Lloyd's Placing API Technical Model before the developer portal was retired.
envelope:
  media_type: application/json
  shape: '{"Message": "<human readable>", "Code": <http status>}'
  fields:
  - {name: Message, type: string, description: human-readable error message; not intended for end-user display}
  - {name: Code, type: integer, description: HTTP status code repeated in the body}
  gateway_example: '{"Code": 401, "Message": "Client certificate is missing. Ref: b2fc01e9-b7f9-49b1-8f5d-f6fd7ab70b92"}'
  gateway_example_404: '{"Code": 404, "Message": "API operations not found. Ref: <uuid>"}'
  observed: live probe of https://api.londonmarketgroup.co.uk and https://sand-api.londonmarketgroup.co.uk on 2026-07-25
rules:
- The error document must be machine readable but carry a human-readable message.
- It must not expose internal implementation detail such as stack traces.
- It may carry correlation or transaction identifiers that locate the log entry in the provider (the gateway emits 'Ref: <uuid>').
- It should not echo the whole request payload.
- Providers are required to log details of every request that results in a 4XX.
- Error messages are for operations and development triage - the APIs are service-to-service, not browser-to-service.
status_mapping:
- {case: "The request URI does not map to a known resource", response: "4XX (must)"}
- {case: "The request URI contains invalid parameters", response: "4XX (must)"}
- {case: "The request payload fails schema validation", response: "4XX (must)"}
- {case: "The request payload is incompatible with application invariants", response: "4XX (must)"}
- {case: "The request payload is incompatible with application state", response: "4XX (must)"}
- {case: "Payload plus application state exposes an application bug", response: "5XX (should), 4XX (may)"}
- {case: "A backend dependency has failed", response: "5XX (must)"}
- {case: "The backend service is unavailable and not responding", response: "5XX from the API gateway (must)"}
- {case: "An unsupported _order, _select or filter feature was requested", response: "501 (must)"}
