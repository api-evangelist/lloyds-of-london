actions:
  apisYmlCreated: true
  openapiDirectoryCreated: false
  reason: |
    Three real Lloyd's market APIs are recorded from Lloyd's own published catalogue and
    documentation, with archived documentation URLs as provenance. No OpenAPI/Swagger file was
    saved because none could be retrieved: the one documented specification URL is unreachable
    (portal retired) and unarchived. Nothing was reconstructed or inferred.
