aid: lloyds-of-london
name: Lloyd's of London
review:
  question: Does Lloyd's of London expose a real, self-serve public API surface, or is its
    integration surface partner-gated?
  answer: partner-gated
  date: '2026-07-25'
  reviewer: API Evangelist
  homeMarket: United Kingdom
  tier: market-infrastructure
  gated: true
findings:
  summary: |
    Lloyd's of London is a market body, not a carrier, and its public technical surface is
    standards-and-documentation-first. Lloyd's did run a genuine developer portal — the Lloyd's
    API Development Portal at developer.lloyds.com, launched in BETA on 8 June 2020 under the
    "API Factory" programme — which published a Base API Standard, authentication guidance, a
    registration and onboarding path, and a catalogue of three market APIs (Placing - Submission
    and Quote, Placing - Firm Order, and RPAC for delegated authority risk/premium/claims). That
    portal is no longer serving content: on 2026-07-25 https://developer.lloyds.com/ over HTTPS
    did not complete a TLS connection from two IPs (curl exit 28, connection timed out), and over
    HTTP port 80 it returned 301 Moved Permanently to https://www.lloyds.com/. Internet Archive
    captures corroborate the retirement — snapshots return 200 through 2022-01-25 and 301 to
    https://www.lloyds.com/ from 2024-04-06 onward. No replacement developer portal is published:
    developers.lloyds.com and docs.lloyds.com do not resolve in DNS, and /developers, /developer,
    /api, /partners and /integrations on www.lloyds.com all return 404.
    api.lloyds.com resolves and is a live Azure API Management gateway, but every anonymous path
    tried returns the APIM JSON body {"statusCode": 404, "message": "Resource not found"} — it is
    a backing gateway, not a documented public API.
    The Placing API base URL documented on the portal,
    https://api.londonmarketgroup.co.uk/PPL/Lloyds/Placing/V1, is a live London Market Azure API
    Management gateway (DNS resolves to api-londonmarketgroup.azure-api.net) but returns the same
    APIM 404 anonymously.
    Onboarding was never self-serve for production: per the portal's Registration and Onboarding
    page, an API consumer (broker, carrier or market vendor) must be onboarded to the LIMOSS API
    Gateway / LIMOSS Common Services, be guested into each of the three Common Services
    environments (Sandbox, PreProd, Prod) separately, register its application in the Common
    Services Azure Active Directory, and register an X.509 certificate per environment.
    Sample source code lived in a private GitHub repository (lloydsdigital/placing-api) reachable
    only through a portal GitHub challenge; the lloydsdigital organisation exists with 0 public
    repositories, as does the LloydsOfLondon "Lloyd's Market Community" organisation.
    Verdict: no public self-serve API; a real but retired developer portal; genuine market APIs
    that are and always were partner-gated. Recording this accurately is the finding.
  developerPortal:
    url: https://developer.lloyds.com/
    classification: retired real developer portal (was a genuine self-serve documentation site in
      BETA; production API access was always partner-gated)
    liveStatusHttps: '000 — TLS connection timed out (curl exit 28) against 165.160.13.20 and
      165.160.15.20 on 2026-07-25'
    liveStatusHttp: '301 Moved Permanently -> https://www.lloyds.com/ (2026-07-25)'
    archivedStatus: '200 through 2022-01-25; 301 to https://www.lloyds.com/ from 2024-04-06
      (Internet Archive CDX)'
    selfServe: false
    loginWall: false
    marketingOnly: false
