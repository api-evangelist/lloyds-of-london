  openAPI:
    harvested: false
    specsSaved: 0
    documentedSpec:
      url: https://developer.lloyds.com/placingsubmissionandquote-v1/static/resources/Swagger_PlacingSubmissionAndQuote_v1.10.202004160916.json
      note: |
        The Lloyd's Placing API Technical Model page states: "The swagger or OpenAPI 3.0 file for
        this version of the API (v1.10) can be downloaded via this link." The link above is the
        exact href published on that page. It could NOT be harvested: the live host does not
        complete a TLS connection (000 on 2026-07-25) and the file was never captured by the
        Internet Archive (Wayback returns 404 for it; a CDX query for
        developer.lloyds.com/placingsubmissionandquote-v1/static/* returns no rows). Nothing was
        saved rather than reconstruct a spec — no openapi/ directory exists in this repo.
    provenanceOfDocumentation:
    - url: https://web.archive.org/web/20210128055606/https://developer.lloyds.com/placingsubmissionandquote-v1/Technical-Model
      fetched: '2026-07-25'
      status: 200
      note: Archived Technical Model page — carries the Swagger download link, request/response
        examples and the api.londonmarketgroup.co.uk base URL.
    - url: https://web.archive.org/web/20210128061829/https://developer.lloyds.com/placingsubmissionandquote-v1/Key-Details-On-API
      fetched: '2026-07-25'
      status: 200
      note: Archived Key Details page — resource list (BrokerDepartment, Submission,
        SubmissionDocument, SubmissionUnderwriter, SubmissionDialogue,
        UnderwriterOrganisation), endpoint version 1.10, endpoint URL
        https://api.londonmarketgroup.co.uk/PPL/Lloyds/Placing/V1.
    - url: https://web.archive.org/web/20200930085423/https://developer.lloyds.com/Get-Started/Authentication-Information
      fetched: '2026-07-25'
      status: 200
      note: Archived authentication guidance — Azure AD, OpenID Connect, JWT, on-behalf-of flow,
        service accounts, user_impersonation scope, X.509 certificates.
    - url: https://web.archive.org/web/20200930075931/https://developer.lloyds.com/Get-Started/Registration-Onboarding
      fetched: '2026-07-25'
      status: 200
      note: Archived onboarding page — LIMOSS Common Services onboarding, per-environment
        guesting, Azure AD app registration, X.509 registration.
    - url: https://web.archive.org/web/20200610082013/https://developer.lloyds.com/Explore-Innovate
      fetched: '2026-07-25'
      status: 200
      note: Archived API catalogue — the three published APIs.
    - url: https://web.archive.org/web/20200930095802/https://developer.lloyds.com/Get-Started/Base-API-Standard
      fetched: '2026-07-25'
      status: 200
      note: Archived Base API Standard — REST/JSON, synchronous request-response only; SOAP,
        message-oriented and publish-subscribe interfaces explicitly out of scope.
  acordPosture: ACORD-aligned market standards body — Core Data Record and Coverholder Reporting
    Standards align to ACORD technical standards, Lloyd's funds free ACORD membership for all
    coverholders (ACORD Delegated Authority Data Standards), and ACORD publicly mapped its data
    messaging standards and digital solutions to the Lloyd's API Factory placement specifications
    (June 2020); no ACORD certification of a Lloyd's-run API is claimed
  acordEvidence:
  - url: https://www.lloyds.com/market-resources/requirements-and-standards/core-data-record
    quote: The CDR aligns with ACORD technical standards, which are the agreed method for
      submitting and exchanging data within the London market, and will be used to drive digital
      processing, consistent with the MRC v3.
  - url: https://www.lloyds.com/insights/news/lloyds-provides-acord-membership-for-all-coverholders
    quote: Lloyd's coverholders will have access to ACORD Delegated Authority Data Standards,
      information, training, and other valuable resources.
  - url: https://www.acord.org/ACORD-about/acord-news/2020/06/11/acord-announces-mapping-of-lloyd-s-api-factory-standards-to-existing-data-standards-solutions
    note: ACORD announcement mapping ACORD Data Messaging Standards and Digital Solutions to the
      Lloyd's API Factory placement specifications.
  insuranceVerbs:
    quote: 'yes — Placing API Submission and Quote v1 (request for quote, underwriter quote
      response); partner-only (brokers and carriers onboarded to LIMOSS)'
    bind: 'yes — Placing API Firm Order ("Finalise Placings, Bind Risks, Sign Transactions");
      catalogue entry only, no public reference; partner-only'
    issue: not exposed as a Lloyd's API — policy issuance sits with managing agents and syndicates
    fnol: 'partial — RPAC submits risk, premium and claims details for delegated authority
      placements (reporting rather than a live FNOL API); partner-only. The Core Data Record
      explicitly covers "claims matching at first notification of loss".'
    audience: partner-only (brokers, carriers/managing agents, coverholders, market vendors). No
      consumer-facing and no agent self-serve surface.
  authModel:
    scheme: OAuth 2.0 / OpenID Connect via Azure Active Directory (Common Services tenant), JWT
      bearer tokens
    flows:
    - authorization-code with on-behalf-of token exchange for application user tokens
    - service account (headless server-to-server) tokens
    scopes:
    - user_impersonation
    additional: X.509 client certificate must be registered per LIMOSS environment; all calls pass
      through the LIMOSS API Gateway
    environments:
    - Sandbox
    - PreProd
    - Production
    selfServeKeys: false
  webhooks:
    present: false
    asyncapi: false
    note: No event catalog, webhook documentation or AsyncAPI definition was found. The Base API
      Standard explicitly places message-originated and publish-subscribe interfaces OUT of
      scope, so the absence is by design.
  postman:
    publicCollection: false
    note: The portal's roadmap mentioned running testing tools such as Postman against a sandbox
      test harness for registered users; no public Postman collection or workspace was found.
  graphql:
    present: false
  grpc:
    present: false
  transports:
  - protocol: REST
    scheme: https
    baseURL: https://api.londonmarketgroup.co.uk/PPL/Lloyds/Placing/V1
    documented: true
    publiclyAccessible: false
    note: Live Azure API Management gateway; returns APIM 404 anonymously. Access requires LIMOSS
      onboarding, Azure AD token and registered X.509 certificate.
  - protocol: SOAP
    documented: false
    note: Explicitly out of scope of the Lloyd's Base API Standard.
  - protocol: WebSocket
    documented: false
  - protocol: GraphQL
    documented: false
  otherPublishedSurfaces:
  - name: Lloyd's Insights Hub
    url: https://insights.lloyds.com/
    status: 200
    note: 'The Core Data Record page states the interactive CDR Glossary dashboard "and
      accompanying data feed (available via an API)" is delivered through the Insights Hub, and
      that "your company will need to be registered for you to have access". Registration-gated;
      no public documentation, no base URL and no specification published. Contact:
      insightshub@lloyds.com.'
  - name: Crystal+
    url: https://crystalplus.lloyds.com/home
    status: 200
    note: Lloyd's international regulatory and tax requirements database for the market;
      web application behind login, no documented API.
  - name: Delegated Data Manager (DDM)
    url: https://www.lloyds.com/market-resources/tools/delegated-data-manager/faqs
    status: 200
    note: Market bordereaux service run through LIMOSS, powered by the Tide platform from Charles
      Taylor InsurTech; a SaaS application for managing agents, not a published API.
  - name: LIMOSS Market Business Glossary
    note: Referenced by Lloyd's as the centralised source of business definitions, standards and
      reference data for the London Market (hosts interactive CDR v3.2 and MRC v3). Operated by
      LIMOSS, not by Lloyd's directly.
